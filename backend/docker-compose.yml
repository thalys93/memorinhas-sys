name: memorinhas

services:
  memorinhas_db:
    image: postgres:16
    container_name: memorinhas_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-memorinhas_db}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - memorinhas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: memorinhas_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: memorinhas_db
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      memorinhas_db:
        condition: service_healthy

volumes:
  memorinhas_pgdata:
    external: true
    name: backend_postgres_data
